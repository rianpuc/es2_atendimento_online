name: CI

on:
  push:
  pull_request:

jobs:

  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: agenda_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Testes Unitários
        run: mvn test -Dtest="*ControllerTest" -B

      - name: Testes Integração
        run: mvn test -Dtest="IntegracaoTest" -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: agenda_test
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Cobertura JaCoCo
        run: mvn verify -B

  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Testes React
        run: npm test -- --coverage --watchAll=false

      - name: Build Frontend
        run: npm run build